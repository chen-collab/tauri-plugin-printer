<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Print Render Engine</title>
  <!--
    打印渲染引擎（三层架构之「纯计算引擎」层）
    ============================================
    单一职责：接收模板 JSON + 打印数据 + 纸张参数，
    实例化 hiprint 模板 → 等待全部图片加载 → 计算内容像素高度 →
    输出内嵌 Base64 图片的完整打印 HTML。

    禁止：业务判断、打印机选择、打印动作、文件读写、网络请求。

    对外 API：
      window.renderAndCalculate({ templateJson, dataJson, paperWidthMm, paperHeightMm })
        -> Promise<{ html: string, contentHeightPx: number }>
  -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft YaHei", "SimHei", sans-serif; background: transparent; }
    /* 渲染容器：离屏定位，不显示但参与布局计算 */
    #render-container {
      position: absolute;
      left: -99999px;
      top: 0;
      visibility: hidden;
      pointer-events: none;
    }
    @page { margin: 0; }
  </style>

  <!--
    注意：外部 JS 库（jquery/jsbarcode/bwip-js/vue-plugin-hiprint）不通过 <script src> 加载，
    因为 file:// 页面的 <script src> 可能被 WebView2 安全策略阻止。
    改由 Rust 端在导航完成后用 ExecuteScript 依次注入库文件内容。
  -->
</head>
<body>
  <!-- 渲染容器（离屏，只用于布局计算） -->
  <div id="render-container"></div>

  <script>
    (function () {
      'use strict';

      // 获取 hiprint 全局对象（库可能由 Rust 端注入，必须动态读取）
      function getHiprint() {
        return window.hiprint || (window['vue-plugin-hiprint'] && window['vue-plugin-hiprint'].hiprint);
      }

      function getDefaultElementTypeProvider() {
        var vpo = window['vue-plugin-hiprint'];
        return vpo ? vpo.defaultElementTypeProvider : null;
      }

      // hiprint 只初始化一次
      var inited = false;
      function ensureInit() {
        if (inited) return;
        var hiprint = getHiprint();
        if (!hiprint) throw new Error('hiprint not loaded');
        var defaultElementTypeProvider = getDefaultElementTypeProvider();
        if (defaultElementTypeProvider) {
          hiprint.init({ providers: [new defaultElementTypeProvider()] });
        }
        // 禁用自动 socket 连接（纯渲染引擎不需要）
        if (typeof hiprint.setConfig === 'function') {
          hiprint.setConfig({
            movingDistance: 2.5,
            text: {
              supportOptions: [
                { name: 'styler', hidden: true },
                { name: 'formatter', hidden: true },
              ],
            },
          });
        }
        inited = true;
      }

      /**
       * 等待容器内所有图片加载完成
       * @param {HTMLElement} container - 容器元素
       * @param {number} timeoutMs - 超时时间（毫秒）
       * @returns {Promise<void>}
       */
      function waitForImages(container, timeoutMs) {
        return new Promise(function (resolve, reject) {
          var imgs = container.querySelectorAll('img');
          if (imgs.length === 0) {
            resolve();
            return;
          }

          var loaded = 0;
          var total = imgs.length;
          var done = false;

          var timeoutId = setTimeout(function () {
            if (done) return;
            done = true;
            // 超时不报错，返回已加载的部分
            resolve();
          }, timeoutMs);

          function checkDone() {
            loaded++;
            if (loaded >= total && !done) {
              done = true;
              clearTimeout(timeoutId);
              resolve();
            }
          }

          for (var i = 0; i < total; i++) {
            (function (img) {
              // 已经加载完成（缓存或 base64）
              if (img.complete && img.naturalWidth !== undefined) {
                checkDone();
                return;
              }
              img.onload = checkDone;
              img.onerror = checkDone; // 加载失败也算完成（不阻塞）
            })(imgs[i]);
          }
        });
      }

      /**
       * 将容器内所有图片转为 base64 data URI
       * （隐藏 WebView 打印窗口无法加载网络/鉴权图片，必须内嵌）
       * @param {HTMLElement} container - 容器元素
       * @returns {Promise<void>}
       */
      function convertImagesToBase64(container) {
        var imgs = container.querySelectorAll('img');
        if (imgs.length === 0) return Promise.resolve();

        var tasks = [];
        for (var i = 0; i < imgs.length; i++) {
          tasks.push(convertOne(imgs[i]));
        }
        return Promise.all(tasks).then(function () { });

        function convertOne(img) {
          return new Promise(function (resolve) {
            var src = img.getAttribute('src');
            if (!src || src.indexOf('data:') === 0 || src.indexOf('blob:') === 0) {
              resolve();
              return;
            }
            try {
              var canvas = document.createElement('canvas');
              canvas.width = img.naturalWidth || img.width || 1;
              canvas.height = img.naturalHeight || img.height || 1;
              var ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              var dataUrl = canvas.toDataURL('image/png');
              img.setAttribute('src', dataUrl);
            } catch (e) {
              // 跨域等失败，保留原图
            }
            resolve();
          });
        }
      }

      /**
       * 渲染并计算高度
       * @param {Object} params
       * @param {string} params.templateJson - hiprint 模板 JSON 字符串
       * @param {string} params.dataJson - 打印数据 JSON 字符串
       * @param {number} params.paperWidthMm - 纸张宽度（mm）
       * @param {number} [params.paperHeightMm] - 纸张高度（mm），0 或不传表示自适应
       * @returns {Promise<{html: string, contentHeightPx: number}>}
       */
      window.renderAndCalculate = function (params) {
        return new Promise(function (resolve, reject) {
          // 超时保护：30 秒后自动 reject
          var timeoutId = setTimeout(function () {
            reject(new Error('渲染超时（30s）：可能是图片加载卡住或 hiprint 内部错误'));
          }, 30000);

          try {
            ensureInit();

            var templateObj;
            try {
              templateObj = JSON.parse(params.templateJson);
            } catch (e) {
              clearTimeout(timeoutId);
              reject(new Error('模板 JSON 解析失败: ' + e.message));
              return;
            }

            // 热敏小票为连续纸：强制不分页模式，由内容撑开高度。
            // 避免 hiprint 按面板固定高度分页导致「第二页空白 / 一行一页」。
            if (templateObj && Array.isArray(templateObj.panels)) {
              templateObj.panels.forEach(function (p) {
                p.panelPageRule = 'none';      // 不分页：热敏连续纸由内容撑开高度
                p.paperNumberDisabled = true;  // 禁用页码（避免 paperNumberTop 被甩到远页产生多页空白）
              });
            }

            var dataObj;
            try {
              dataObj = JSON.parse(params.dataJson);
            } catch (e) {
              clearTimeout(timeoutId);
              reject(new Error('数据 JSON 解析失败: ' + e.message));
              return;
            }

            var paperWidthMm = params.paperWidthMm;
            if (!paperWidthMm || paperWidthMm <= 0) {
              clearTimeout(timeoutId);
              reject(new Error('纸张宽度必须大于 0'));
              return;
            }

            // 设置渲染容器宽度（像素，假设 96 DPI：1mm = 96/25.4 px）
            var container = document.getElementById('render-container');
            var widthPx = (paperWidthMm * 96) / 25.4;
            container.style.width = widthPx + 'px';

            // 清空容器
            container.innerHTML = '';

            // 创建 hiprint 模板实例并渲染
            var tpl = new hiprint.PrintTemplate({
              template: templateObj,
              dataMode: 1,
              history: false,
            });

            // 渲染到离屏容器（getHtml 方式更干净）
            var htmlResult = tpl.getHtml(dataObj);
            if (!htmlResult || !htmlResult.length) {
              clearTimeout(timeoutId);
              reject(new Error('模板渲染失败：无内容'));
              return;
            }

            // 获取渲染后的 HTML 内容
            var innerHtml = htmlResult.html();
            container.innerHTML = innerHtml;

            // 等待图片加载（超时 10 秒）
            waitForImages(container, 10000).then(function () {
              // 所有图片加载完成后，转 base64
              return convertImagesToBase64(container);
            }).then(function () {
              clearTimeout(timeoutId);
              // 计算内容像素高度
              var contentHeightPx = container.scrollHeight;

              // 构建完整 HTML 文档（带 @page CSS）
              var fullHtml = buildFullHtml(
                container.innerHTML,
                paperWidthMm,
                contentHeightPx
              );

              resolve({
                html: fullHtml,
                contentHeightPx: contentHeightPx,
              });
            }).catch(function (err) {
              clearTimeout(timeoutId);
              reject(err);
            });

          } catch (err) {
            clearTimeout(timeoutId);
            reject(err);
          }
        });
      };

      /**
       * 构建完整 HTML 文档
       * @param {string} bodyHtml - body 内容
       * @param {number} paperWidthMm - 纸张宽度（mm）
       * @param {number} contentHeightPx - 内容像素高度
       * @returns {string}
       */
      function buildFullHtml(bodyHtml, paperWidthMm, contentHeightPx) {
        // 像素转 mm（96 DPI）
        var contentHeightMm = (contentHeightPx * 25.4) / 96;
        if (contentHeightMm < 10) contentHeightMm = 10;
        var heightMm = Math.ceil(contentHeightMm * 10) / 10;

        // hiprint 必需样式（表格边框/内边距/表头背景、线框/矩形椭圆描边、字体、word-break）。
        // 由 Rust 引擎注入到 window.__hiprintCss__，否则打印件与预览不一致。
        var hiprintCss = window.__hiprintCss__ || '';

        return '<!DOCTYPE html>\n' +
          '<html lang="zh-CN">\n' +
          '<head>\n' +
          '<meta charset="UTF-8">\n' +
          '<style>\n' +
          '  * { box-sizing: border-box; margin: 0; padding: 0; }\n' +
          '  body { font-family: "Microsoft YaHei", "SimHei", sans-serif; }\n' +
          '  @page { size: ' + paperWidthMm + 'mm ' + heightMm + 'mm; margin: 0; }\n' +
          hiprintCss + '\n' +
          '</style>\n' +
          '</head>\n' +
          '<body>' + bodyHtml + '</body>\n' +
          '</html>';
      }

      // 标记引擎就绪
      window.__printEngineReady = true;

    })();
  </script>
</body>
</html>
