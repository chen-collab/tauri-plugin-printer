[package]
name = "tauri-plugin-printer-v2"
version = "0.4.1"
authors = [ "chen-collab" ]
description = "Tauri plugin for printing"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js",  "/node_modules", "/src/bin"]
links = "tauri-plugin-printer-v2"
license = "MIT"
repository = "https://github.com/chen-collab/tauri-plugin-printer"
keywords = ["tauri", "plugin", "printer"]
categories = ["api-bindings", "development-tools"]

[dependencies]
tauri = { version = "=2.11.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Printing", "Win32_Graphics_Gdi"] }
webview2-com = "0.38"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
